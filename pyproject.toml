[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spendcoder"
version = "0.1.0"
description = "Agentic GL coding for corporate card spend: bring your own rules, calibrated decisions, auditable review, and GEPA prompt tuning at onboarding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ansh Shah" }]
keywords = ["accounting", "llm", "gepa", "openrouter", "agents", "expense-classification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# The core pipeline is standard-library only.
dependencies = []

[project.optional-dependencies]
tune = ["gepa>=0.1.4,<0.2"]
dev = ["pytest>=8", "gepa>=0.1.4,<0.2"]

[project.scripts]
spendcoder = "spendcoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spendcoder = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
