name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Smoke run (offline mock backend)
        run: spendcoder init /tmp/demo --template acme && cd /tmp/demo && spendcoder doctor && spendcoder onboard --backend mock --budget 60 && spendcoder run --backend mock
